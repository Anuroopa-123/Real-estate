<div class="login-scene">

  <!-- Animated background architecture lines -->
  <div class="arch-bg">
    <svg class="arch-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#c9a96e;stop-opacity:0.3"/>
          <stop offset="100%" style="stop-color:#c9a96e;stop-opacity:0"/>
        </linearGradient>
      </defs>
      <!-- Blueprint grid lines -->
      <line x1="0" y1="150" x2="1440" y2="150" stroke="url(#lineGrad)" stroke-width="0.5"/>
      <line x1="0" y1="300" x2="1440" y2="300" stroke="url(#lineGrad)" stroke-width="0.5"/>
      <line x1="0" y1="450" x2="1440" y2="450" stroke="url(#lineGrad)" stroke-width="0.5"/>
      <line x1="0" y1="600" x2="1440" y2="600" stroke="url(#lineGrad)" stroke-width="0.5"/>
      <line x1="0" y1="750" x2="1440" y2="750" stroke="url(#lineGrad)" stroke-width="0.5"/>
      <line x1="200" y1="0" x2="200" y2="900" stroke="url(#lineGrad)" stroke-width="0.5"/>
      <line x1="480" y1="0" x2="480" y2="900" stroke="url(#lineGrad)" stroke-width="0.5"/>
      <line x1="720" y1="0" x2="720" y2="900" stroke="url(#lineGrad)" stroke-width="0.5"/>
      <line x1="960" y1="0" x2="960" y2="900" stroke="url(#lineGrad)" stroke-width="0.5"/>
      <line x1="1240" y1="0" x2="1240" y2="900" stroke="url(#lineGrad)" stroke-width="0.5"/>
      <!-- Diagonal architectural lines -->
      <line x1="0" y1="900" x2="600" y2="0" stroke="#c9a96e" stroke-width="0.3" opacity="0.15"/>
      <line x1="840" y1="900" x2="1440" y2="0" stroke="#c9a96e" stroke-width="0.3" opacity="0.15"/>
    </svg>

    <!-- Floating property silhouettes -->
    <div class="building b1"></div>
    <div class="building b2"></div>
    <div class="building b3"></div>
  </div>

  <!-- Left Panel: Branding -->
  <div class="brand-panel">
    <div class="brand-content">
      <div class="logo-mark">
        <div class="logo-diamond">
          <svg viewBox="0 0 60 60" width="60" height="60">
            <polygon points="30,2 58,30 30,58 2,30" fill="none" stroke="#c9a96e" stroke-width="1.5"/>
            <polygon points="30,12 48,30 30,48 12,30" fill="none" stroke="#c9a96e" stroke-width="0.8" opacity="0.5"/>
            <polygon points="30,22 38,30 30,38 22,30" fill="#c9a96e"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-main">ÉLITE</span>
          <span class="logo-sub">PROPERTIES</span>
        </div>
      </div>

      <div class="brand-tagline">
        <div class="tagline-line"></div>
        <p>Where Luxury Meets<br/><em>Precision</em></p>
        <div class="tagline-line"></div>
      </div>

      <div class="stats-row">
        <div class="stat">
          <span class="stat-num">2.4K</span>
          <span class="stat-label">Properties</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-num">840</span>
          <span class="stat-label">Agents</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-num">98%</span>
          <span class="stat-label">Satisfied</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel: Login Form -->
  <div class="form-panel">
    <div class="form-card">

      <!-- Role Selector -->
      <div class="role-selector">
        <p class="role-label">Sign in as</p>
        <div class="role-tabs">
          <button
            *ngFor="let r of roles"
            class="role-tab"
            [class.active]="selectedRole === r.value"
            (click)="selectRole(r.value)">
            <span class="role-icon">{{ r.icon }}</span>
            <span class="role-name">{{ r.label }}</span>
          </button>
        </div>
      </div>

      <!-- Role Context Banner -->
      <div class="role-context" [ngClass]="selectedRole.toLowerCase()">
        <div class="context-icon">{{ activeRole?.icon }}</div>
        <div class="context-text">
          <span class="context-title">{{ activeRole?.label }}</span>
          <span class="context-desc">{{ activeRole?.description }}</span>
        </div>
        <div class="context-pulse"></div>
      </div>

      <!-- Form -->
      <div class="form-fields">
        <div class="field-group">
          <label class="field-label">Email Address</label>
          <div class="field-wrap" [class.focused]="emailFocused" [class.has-value]="email">
            <svg class="field-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <input
              type="email"
              [(ngModel)]="email"
              placeholder="you@example.com"
              (focus)="emailFocused = true"
              (blur)="emailFocused = false"
              class="field-input"
            />
            <div class="field-line"></div>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Password</label>
          <div class="field-wrap" [class.focused]="passFocused" [class.has-value]="password">
            <svg class="field-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input
              [type]="showPass ? 'text' : 'password'"
              [(ngModel)]="password"
              placeholder="••••••••"
              (focus)="passFocused = true"
              (blur)="passFocused = false"
              class="field-input"
            />
            <button class="toggle-pass" (click)="showPass = !showPass" type="button">
              <svg *ngIf="!showPass" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPass" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
            <div class="field-line"></div>
          </div>
        </div>

        <div class="form-meta">
          <label class="remember-wrap">
            <input type="checkbox" [(ngModel)]="rememberMe" class="remember-check"/>
            <span class="remember-custom"></span>
            <span class="remember-text">Remember me</span>
          </label>
          <a class="forgot-link" href="#">Forgot password?</a>
        </div>

        <!-- Error Message -->
        <div class="error-msg" *ngIf="errorMsg">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ errorMsg }}
        </div>

        <!-- Submit Button -->
        <button class="submit-btn" [class.loading]="isLoading" (click)="login()" [disabled]="isLoading">
          <span class="btn-text" *ngIf="!isLoading">
            Enter as {{ activeRole?.label }}
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </span>
          <span class="btn-loader" *ngIf="isLoading">
            <span class="loader-dot"></span>
            <span class="loader-dot"></span>
            <span class="loader-dot"></span>
          </span>
          <div class="btn-shimmer"></div>
        </button>
      </div>

      <!-- Footer -->
      <p class="form-footer">
        Protected by enterprise-grade security
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </p>

    </div>
  </div>

</div>
