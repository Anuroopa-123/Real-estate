<div class="dashboard">

  <div class="header">
    <h1>Admin Dashboard</h1>
    <p>Manage agents and categories</p>
  </div>

  <div class="cards">

    <div class="card">
      <h3>Create Agent</h3>
      <p>Add new property agents</p>
      <button routerLink="/admin/create-agent">
        Create Agent
      </button>
    </div>

    <div class="card">
      <h3>Manage Agents</h3>
      <p>View and manage all agents</p>
      <button routerLink="/admin/agents">
        Manage Agents
      </button>
    </div>

    <div class="card">
      <h3>Property Categories</h3>
      <p>Manage property types</p>
      <button routerLink="/admin/categories">
        Manage Categories
      </button>
    </div>

  </div>

</div>
